<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>iTestU</title>
    <style>
      :root {
        --navy: #0f172a;
        --navy-mid: #1e293b;
        --muted: #94a3b8;
        --line: rgba(148, 163, 184, 0.25);
        --danger: #f43f5e;
        --ok: #10b981;
        --surface: #ffffff;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        height: 100%;
        background: radial-gradient(1200px 600px at 20% -10%, #1e3a5f 0%, var(--navy) 55%);
        color: #e2e8f0;
        font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      }

      body {
        display: grid;
        place-items: center;
        padding: 24px;
      }

      .card {
        width: min(420px, 100%);
        background: rgba(15, 23, 42, 0.72);
        border: 1px solid var(--line);
        border-radius: 20px;
        padding: 28px 24px;
        text-align: center;
        backdrop-filter: blur(10px);
        box-shadow: 0 24px 60px rgba(0, 0, 0, 0.35);
      }

      .mark {
        width: 56px;
        height: 56px;
        margin: 0 auto 16px;
        border-radius: 16px;
        display: grid;
        place-items: center;
        background: linear-gradient(145deg, #e11d48, #be123c);
        font-weight: 800;
        font-size: 18px;
        letter-spacing: -0.02em;
        color: white;
      }

      h1 {
        margin: 0;
        font-size: 1.25rem;
        font-weight: 700;
        color: #f8fafc;
      }

      p {
        margin: 10px 0 0;
        font-size: 0.9rem;
        line-height: 1.5;
        color: var(--muted);
      }

      .actions {
        display: flex;
        gap: 10px;
        justify-content: center;
        margin-top: 20px;
        flex-wrap: wrap;
      }

      button {
        appearance: none;
        border: 0;
        border-radius: 12px;
        padding: 11px 18px;
        font-size: 0.875rem;
        font-weight: 650;
        cursor: pointer;
        transition: transform 0.12s ease, opacity 0.12s ease;
      }

      button:active {
        transform: translateY(1px);
      }

      button:disabled {
        opacity: 0.55;
        cursor: default;
      }

      .primary {
        background: #f8fafc;
        color: var(--navy);
      }

      .ghost {
        background: transparent;
        color: #e2e8f0;
        border: 1px solid var(--line);
      }

      .status {
        margin-top: 16px;
        font-size: 0.8rem;
        color: var(--muted);
        min-height: 1.2em;
      }

      .spinner {
        width: 18px;
        height: 18px;
        border: 2px solid rgba(248, 250, 252, 0.25);
        border-top-color: #f8fafc;
        border-radius: 50%;
        display: inline-block;
        vertical-align: -4px;
        margin-right: 8px;
        animation: spin 0.8s linear infinite;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      #toast-root {
        position: fixed;
        right: 16px;
        bottom: 16px;
        z-index: 50;
        display: flex;
        flex-direction: column;
        gap: 8px;
        width: min(360px, calc(100vw - 32px));
        pointer-events: none;
      }

      .toast {
        pointer-events: auto;
        display: flex;
        gap: 10px;
        align-items: flex-start;
        background: var(--surface);
        color: #0f172a;
        border-radius: 14px;
        padding: 12px 14px;
        border: 1px solid #fecdd3;
        box-shadow: 0 12px 30px rgba(0, 0, 0, 0.25);
        animation: toast-in 0.22s ease-out;
      }

      .toast.ok {
        border-color: #a7f3d0;
      }

      .toast-dot {
        width: 10px;
        height: 10px;
        margin-top: 5px;
        border-radius: 999px;
        background: var(--danger);
        flex-shrink: 0;
      }

      .toast.ok .toast-dot {
        background: var(--ok);
      }

      .toast strong {
        display: block;
        font-size: 0.875rem;
      }

      .toast span {
        display: block;
        margin-top: 2px;
        font-size: 0.8rem;
        color: #64748b;
      }

      @keyframes toast-in {
        from {
          opacity: 0;
          transform: translateY(8px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .hidden {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <div class="card" id="boot">
      <div class="mark">iTu</div>
      <h1 id="title">Starting iTestU</h1>
      <p id="message">Checking your connection to the exam servers…</p>
      <div class="actions hidden" id="actions">
        <button class="primary" id="retry" type="button">Try again</button>
        <button class="ghost" id="open-login" type="button">Open sign-in</button>
      </div>
      <div class="status" id="status">
        <span class="spinner"></span>Connecting…
      </div>
    </div>
    <div id="toast-root" aria-live="polite"></div>

    <script>
      (function () {
        /** Override via env-injected build or Tauri app-data for local Tauri dev. */
        var DEFAULT_ORIGIN = "https://www.itestu.uz";
        var resumeCache = { path: null, origin: null };

        function tauriInvoke(cmd, args) {
          try {
            var core = window.__TAURI__ && window.__TAURI__.core;
            if (core && typeof core.invoke === "function") {
              return core.invoke(cmd, args || {});
            }
          } catch (_) {}
          return Promise.resolve(null);
        }

        function loadResumeState() {
          return tauriInvoke("load_desktop_resume").then(function (data) {
            if (data && typeof data === "object") {
              resumeCache.path = data.path || null;
              resumeCache.origin = data.origin || null;
            }
            return resumeCache;
          }).catch(function () {
            return resumeCache;
          });
        }

        function resolveOrigin() {
          if (resumeCache.origin && /^https?:\/\//i.test(resumeCache.origin)) {
            return String(resumeCache.origin).replace(/\/$/, "");
          }
          if (window.__ITESTU_WEB_ORIGIN__) {
            return String(window.__ITESTU_WEB_ORIGIN__).replace(/\/$/, "");
          }
          return DEFAULT_ORIGIN;
        }

        function resolveTargetPath() {
          if (resumeCache.path && resumeCache.path.charAt(0) === "/") {
            return resumeCache.path;
          }
          return "/login";
        }

        var titleEl = document.getElementById("title");
        var messageEl = document.getElementById("message");
        var statusEl = document.getElementById("status");
        var actionsEl = document.getElementById("actions");
        var retryBtn = document.getElementById("retry");
        var openLoginBtn = document.getElementById("open-login");
        var toastRoot = document.getElementById("toast-root");
        var connecting = false;
        var lastToastAt = 0;

        function showToast(title, description, ok) {
          var now = Date.now();
          if (now - lastToastAt < 1500) return;
          lastToastAt = now;
          var el = document.createElement("div");
          el.className = "toast" + (ok ? " ok" : "");
          el.innerHTML =
            '<div class="toast-dot"></div><div><strong></strong><span></span></div>';
          el.querySelector("strong").textContent = title;
          el.querySelector("span").textContent = description || "";
          toastRoot.appendChild(el);
          setTimeout(function () {
            if (el.parentNode) el.parentNode.removeChild(el);
          }, 4500);
        }

        function setConnectingUI() {
          titleEl.textContent = "Starting iTestU";
          messageEl.textContent =
            "Checking your connection to the exam servers…";
          actionsEl.classList.add("hidden");
          statusEl.innerHTML = '<span class="spinner"></span>Connecting…';
          retryBtn.disabled = true;
        }

        function setOfflineUI() {
          titleEl.textContent = "No internet connection";
          messageEl.textContent =
            "iTestU needs a network connection. Your progress stays on our servers — reconnect and continue where you left off.";
          actionsEl.classList.remove("hidden");
          statusEl.textContent = "Waiting for connection…";
          retryBtn.disabled = false;
        }

        function buildAppUrl(path) {
          return resolveOrigin() + (path || "/login");
        }

        function probe(url) {
          return new Promise(function (resolve) {
            var done = false;
            var timer = setTimeout(function () {
              if (done) return;
              done = true;
              resolve(false);
            }, 8000);

            // no-cors still fails when offline / DNS unreachable
            fetch(url, {
              method: "GET",
              mode: "no-cors",
              cache: "no-store",
            })
              .then(function () {
                if (done) return;
                done = true;
                clearTimeout(timer);
                resolve(true);
              })
              .catch(function () {
                if (done) return;
                done = true;
                clearTimeout(timer);
                resolve(false);
              });
          });
        }

        function navigate(path) {
          window.location.replace(buildAppUrl(path));
        }

        function connect(opts) {
          opts = opts || {};
          if (connecting) return;
          connecting = true;
          setConnectingUI();

          var path = opts.forceLogin ? "/login" : resolveTargetPath();
          var probeUrl = buildAppUrl("/login");

          probe(probeUrl).then(function (ok) {
            connecting = false;
            if (!ok) {
              setOfflineUI();
              if (opts.notify !== false) {
                showToast(
                  "Connection failed",
                  "Check your internet and try again. The app stays ready here.",
                  false,
                );
              }
              return;
            }
            if (opts.notifyOnline) {
              showToast(
                "Back online",
                "Opening iTestU…",
                true,
              );
              setTimeout(function () {
                navigate(path);
              }, 350);
              return;
            }
            navigate(path);
          });
        }

        retryBtn.addEventListener("click", function () {
          connect({ notify: true });
        });

        openLoginBtn.addEventListener("click", function () {
          connect({ forceLogin: true, notify: true });
        });

        window.addEventListener("online", function () {
          showToast(
            "Network restored",
            "Reconnecting to iTestU…",
            true,
          );
          connect({ notify: false, notifyOnline: true });
        });

        window.addEventListener("offline", function () {
          setOfflineUI();
          showToast(
            "You are offline",
            "Reconnect to continue. Answers already saved stay on the server.",
            false,
          );
        });

        loadResumeState().then(function () {
          if (navigator.onLine === false) {
            setOfflineUI();
            showToast(
              "You are offline",
              "Reconnect to continue. Answers already saved stay on the server.",
              false,
            );
          } else {
            connect({ notify: true });
          }
        });
      })();
    </script>
  </body>
</html>
