# Redirect donish.live → itestu.uz (legacy staging domain)

server {
    listen 80;
    listen [::]:80;
    server_name donish.live www.donish.live;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    return 301 https://www.itestu.uz$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name donish.live www.donish.live;

    ssl_certificate     /etc/letsencrypt/live/donish.live/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/donish.live/privkey.pem;

    return 301 https://www.itestu.uz$request_uri;
}
