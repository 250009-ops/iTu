# Nginx site config for itestu.uz
# Installed to /etc/nginx/sites-available/itestu.uz
# Canonical host: www.itestu.uz (apex redirects to www)

upstream itestu_web {
    server 127.0.0.1:3000;
    keepalive 64;
}

upstream itestu_api {
    server 127.0.0.1:3001;
    keepalive 64;
}

# HTTP — certbot challenge + redirect to HTTPS www
server {
    listen 80;
    listen [::]:80;
    server_name itestu.uz www.itestu.uz;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://www.itestu.uz$request_uri;
    }
}

# Redirect apex HTTPS to www (canonical)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name itestu.uz;

    ssl_certificate     /etc/letsencrypt/live/itestu.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/itestu.uz/privkey.pem;

    return 301 https://www.itestu.uz$request_uri;
}

# HTTPS — canonical www host
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.itestu.uz;

    ssl_certificate     /etc/letsencrypt/live/itestu.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/itestu.uz/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:50m;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 130m;

    # Exam audio, speaking recordings, result PDFs (written by API to MEDIA_ROOT)
    location /media/ {
        alias /var/www/itestu/media/;
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
    }

    # Large listening audio uploads (admin Content Studio)
    # SSE streams — disable buffering for live monitor / badges / exam events
    location ~ ^/api/v1/(admin/sessions/live/stream|teachers/nav-badges/stream|exam-sessions/[^/]+/events/stream)$ {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        chunked_transfer_encoding off;
        proxy_pass http://itestu_api;
    }

    location /api/ {
        client_max_body_size 130m;
        client_body_timeout 300s;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_pass http://itestu_api/api/;
    }

    # Next.js frontend
    location / {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_pass http://itestu_web;
    }
}
